<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>作品管理</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>

<body>

<div id="toastArea" class="toast-area"></div>

<!-- ================= ヘッダー ================= -->
<header class="app-header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-eyebrow">ARCHIVE LEDGER</span>
      <h1>作品管理</h1>
    </div>
    <button class="icon-btn" id="manageBtn" onclick="toggleManage()" title="データ管理">⚙️</button>
  </div>
</header>

<!-- ================= 検索・操作バー ================= -->
<div class="toolbar">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input id="search" placeholder="検索（名前・作品・コメントなど）" oninput="onSearchInput()">
    <span id="resultCount" class="result-count"></span>
  </div>

  <div class="toolbar-actions">
    <button class="chip-btn" onclick="toggleDetails()" id="viewBtn">全表示</button>
    <button class="chip-btn" onclick="openColumnModal()">🖋 列設定</button>
    <button class="chip-btn" id="multiAddBtn" onclick="toggleMultiAddMode()">🔗 段階追加</button>
    <button class="chip-btn" id="sortLevelBtn" onclick="openSortModal()">⇅ 並び替え</button>
    <button class="chip-btn accent" onclick="openModal()">＋ 追加</button>
  </div>
</div>

<!-- 管理エリア -->
<div id="manageArea" class="manage-panel">
  <p class="manage-title">CSVデータ管理</p>
  <div class="manage-row">
    <label class="file-btn">
      📂 ファイルを選択
      <input type="file" id="csvFile" accept=".csv" onchange="onCsvFileChange()">
    </label>
    <span id="csvFileName" class="file-name">未選択</span>
  </div>
  <div class="manage-row">
    <button class="chip-btn" onclick="importCSV()">⬆ CSV取込</button>
    <button class="chip-btn" onclick="exportCSV()">⬇ CSV出力</button>
    <button class="chip-btn danger" onclick="resetAll()">🗑 全削除</button>
  </div>
</div>

<!-- ================= 列設定 ================= -->
<div id="columnModal" class="modal" onclick="closeColumnModal()">
  <div class="modal-content" onclick="event.stopPropagation()">

    <h3>表示する列</h3>

    <div class="column-actions">
      <button class="text-btn" onclick="setAllColumns(true)">すべて表示</button>
      <button class="text-btn" onclick="setAllColumns(false)">すべて非表示</button>
    </div>

    <div class="column-grid">
      <label class="col-chip"><input type="checkbox" data-col="0">No</label>
      <label class="col-chip"><input type="checkbox" data-col="1">大</label>
      <label class="col-chip"><input type="checkbox" data-col="2">パッケージ</label>
      <label class="col-chip"><input type="checkbox" data-col="3">小</label>
      <label class="col-chip"><input type="checkbox" data-col="4">名前</label>
      <label class="col-chip"><input type="checkbox" data-col="5">作品</label>
      <label class="col-chip"><input type="checkbox" data-col="6">部分</label>
      <label class="col-chip"><input type="checkbox" data-col="7">URL</label>
      <label class="col-chip"><input type="checkbox" data-col="8">⭐</label>
      <label class="col-chip"><input type="checkbox" data-col="9">評価数</label>
      <label class="col-chip"><input type="checkbox" data-col="10">サイト評価</label>
      <label class="col-chip"><input type="checkbox" data-col="11">自分評価</label>
      <label class="col-chip"><input type="checkbox" data-col="12">コメント</label>
      <label class="col-chip"><input type="checkbox" data-col="13">更新日</label>
    </div>

    <button class="chip-btn accent full" onclick="closeColumnModal()">閉じる</button>
  </div>
</div>

<!-- ================= 並び替え（多段階） ================= -->
<div id="sortModal" class="modal" onclick="closeSortModal()">
  <div class="modal-content" onclick="event.stopPropagation()">

    <h3>並び替え設定</h3>
    <p class="modal-hint">上の条件から順に比較し、同じ値のときだけ次の条件で比較します。</p>
    <p id="sortSummary" class="sort-summary"></p>

    <p class="form-section-title">クイック並び替え</p>
    <div class="preset-row">
      <button class="chip-btn" onclick="applySortPreset(0)">更新日：新しい順</button>
      <button class="chip-btn" onclick="applySortPreset(1)">名前：多い順</button>
      <button class="chip-btn" onclick="applySortPreset(2)">⭐：高い順</button>
      <button class="chip-btn" onclick="applySortPreset(3)">自分評価：高い順</button>
      <button class="chip-btn" onclick="applySortPreset(4)">No：登録順</button>
    </div>

    <p class="form-section-title">詳細な条件</p>

    <div id="sortLevelList" class="sort-level-list"></div>

    <div class="sort-list-actions">
      <button class="text-btn" onclick="addSortLevel()">＋ 条件を追加</button>
      <button class="text-btn muted" onclick="resetSortLevels()">既定（No順）に戻す</button>
    </div>

    <p class="modal-hint">表の見出しをタップすると単独ソート、ツールバーの「🔗 段階追加」をONにしてから見出しをタップすると条件を追加できます（PCではShift+クリックでも可）。</p>

    <div class="modal-actions">
      <button class="chip-btn ghost" onclick="closeSortModal()">閉じる</button>
      <button class="chip-btn accent" onclick="applySortLevels()">適用する</button>
    </div>
  </div>
</div>

<!-- ================= 追加／編集 ================= -->
<div id="modal" class="modal" onclick="closeModal()">
  <div class="modal-content" onclick="event.stopPropagation()">

    <h3 id="modalTitle">新しい作品を追加</h3>

    <div class="form-section">
      <p class="form-section-title">分類</p>
      <div class="form-grid form-grid-3">
        <label class="field"><span>大分類 <em>必須</em></span><input id="main" type="number" placeholder="例）1"></label>
        <label class="field"><span>パッケージ</span><input id="package" placeholder="パッケージ名"></label>
        <label class="field"><span>小分類</span><input id="sub" placeholder="例）1-2"></label>
      </div>
    </div>

    <div class="form-section">
      <p class="form-section-title">内容</p>
      <div class="form-grid form-grid-2">
        <label class="field"><span>名前</span><input id="name" placeholder="人物・シリーズ名など"></label>
        <label class="field"><span>作品 <em>必須</em></span><input id="work" placeholder="作品タイトル"></label>
        <label class="field"><span>部分</span><input id="place" placeholder="巻・話数など"></label>
        <label class="field"><span>URL</span><input id="url" type="url" placeholder="https://"></label>
      </div>
    </div>

    <div class="form-section">
      <p class="form-section-title">評価</p>
      <div class="form-grid form-grid-4">
        <label class="field"><span>⭐</span><input id="fav" type="number" placeholder="0"></label>
        <label class="field"><span>評価数</span><input id="ratingCount" type="number" placeholder="0"></label>
        <label class="field"><span>サイト評価</span><input id="siteRating" type="number" placeholder="0"></label>
        <label class="field"><span>自分評価</span><input id="selfRating" type="number" placeholder="0"></label>
      </div>
      <label class="field"><span>コメント</span><textarea id="comment" rows="2" placeholder="メモ・感想など"></textarea></label>
    </div>

    <div class="modal-actions">
      <button class="chip-btn ghost" onclick="closeModal()">キャンセル</button>
      <button class="chip-btn accent" onclick="addItem()">保存する</button>
    </div>
  </div>
</div>

<!-- ================= 確認モーダル ================= -->
<div id="confirmModal" class="modal" onclick="resolveConfirm(false)">
  <div class="modal-content modal-confirm" onclick="event.stopPropagation()">
    <p id="confirmMessage" class="confirm-message"></p>
    <div class="modal-actions">
      <button class="chip-btn ghost" onclick="resolveConfirm(false)">キャンセル</button>
      <button class="chip-btn danger" id="confirmOkBtn" onclick="resolveConfirm(true)">実行する</button>
    </div>
  </div>
</div>

<!-- ================= テーブル ================= -->
<div class="table-wrap">
<table>
<thead>
<tr>
<th onclick="sortBy('no', event)" data-col="0">No<span class="sort-indicator" data-key="no"></span></th>
<th onclick="sortBy('main', event)" data-col="1">大<span class="sort-indicator" data-key="main"></span></th>
<th onclick="sortBy('package', event)" data-col="2">パッケージ<span class="sort-indicator" data-key="package"></span></th>
<th onclick="sortBy('sub', event)" data-col="3">小<span class="sort-indicator" data-key="sub"></span></th>
<th onclick="sortBy('name', event)" data-col="4">名前<span class="sort-indicator" data-key="name"></span></th>
<th onclick="sortBy('work', event)" data-col="5">作品<span class="sort-indicator" data-key="work"></span></th>
<th onclick="sortBy('place', event)" data-col="6">部分<span class="sort-indicator" data-key="place"></span></th>
<th onclick="sortBy('url', event)" data-col="7">URL<span class="sort-indicator" data-key="url"></span></th>
<th onclick="sortBy('fav', event)" data-col="8">⭐<span class="sort-indicator" data-key="fav"></span></th>
<th onclick="sortBy('ratingCount', event)" data-col="9">評価数<span class="sort-indicator" data-key="ratingCount"></span></th>
<th onclick="sortBy('siteRating', event)" data-col="10">サイト<span class="sort-indicator" data-key="siteRating"></span></th>
<th onclick="sortBy('selfRating', event)" data-col="11">自分評価<span class="sort-indicator" data-key="selfRating"></span></th>
<th onclick="sortBy('comment', event)" data-col="12">コメント<span class="sort-indicator" data-key="comment"></span></th>
<th onclick="sortBy('date', event)" data-col="13">更新日<span class="sort-indicator" data-key="date"></span></th>
<th data-col="14">編集</th>
<th data-col="15">削除</th>
</tr>
</thead>

<tbody id="list">
<tr class="state-row"><td colspan="16">読み込み中…</td></tr>
</tbody>
</table>
</div>

<button class="fab" onclick="openModal()" title="追加">＋</button>

</body>
</html>
